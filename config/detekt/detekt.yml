# detekt 기본 설정(buildUponDefaultConfig = true) 위에 이 프로젝트에 필요한 부분만 덮어쓴다.
# 전체 기본값은 ./gradlew detektGenerateConfig 로 확인할 수 있다.

naming:
  # @Composable 함수는 PascalCase 가 공식 규약이므로 FunctionNaming 대상에서 제외한다.
  # ktlint 쪽 동일 설정은 .editorconfig 의 ktlint_function_naming_ignore_when_annotated_with 참고.
  FunctionNaming:
    ignoreAnnotated: ['Composable']

  # Compose 의 top-level ColorScheme/Typography 는 PascalCase 로 선언하는 것이 관례다.
  TopLevelPropertyNaming:
    privatePropertyPattern: '(_)?[A-Za-z][A-Za-z0-9]*'

style:
  # Compose 에서는 Modifier 기본값 등 매직 넘버성 상수가 자연스럽게 등장한다.
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']

complexity:
  # Composable 은 중첩이 깊어지기 쉬워 기본값(임계 4)이 지나치게 엄격하다.
  LongParameterList:
    ignoreAnnotated: ['Composable']
